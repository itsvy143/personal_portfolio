name: Portfolio CI

on: 
  push:
    branches:
      - main

  pull_request:
    branches:
     - main

permissions:
  contents: read

jobs:
  validate-html:
    name: Validate HTML 
    runs-on: ubuntu-latest

    steps:
     - name: Checkout repository
       uses: actions/checkout@v7

     - name: Set up Node.js 
       uses: actions/setup-node@v7 
       with:
         node-version: 24
         package-manager-cache: false

     - name: Validate HTML 
       run: npx --yes html-validate index.html